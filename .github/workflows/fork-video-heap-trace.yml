name: Fork Windows video heap trace

on:
  push:
    branches: [test/windows-video-heap-trace]

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Download compiled initialization probe
        uses: actions/download-artifact@v4
        with:
          name: windows-video-initialization
          github-token: ${{ github.token }}
          run-id: 37998444725
      - name: Install matching debugger and runtime
        env:
          WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
          WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - name: Compare controller startup paths
        run: |
          export PATH="$GITHUB_WORKSPACE/build/core/libs/libs/unpatched:$GITHUB_WORKSPACE/build/tests:/c/winlibs/mingw64/bin:$PATH"
          python - <<'PYTHON'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter
          import os
          import subprocess
          root = Path.cwd()
          binary = root / 'build/tests/guest_video_out_wqhd_detection_tests.exe'
          for name, workers, wgi in [('default_serial', 1, None), ('default_parallel', 2, None), ('wgi_off_parallel', 2, '0')]:
              env = os.environ.copy()
              env['VK_DRIVER_FILES'] = str(root / 'missing_icd.json')
              env['VK_ICD_FILENAMES'] = env['VK_DRIVER_FILES']
              if wgi is not None:
                  env['SDL_JOYSTICK_WGI'] = wgi
              else:
                  env.pop('SDL_JOYSTICK_WGI', None)
              def run(attempt):
                  return subprocess.run([str(binary)], cwd=root / 'build', env=env, capture_output=True, text=True, timeout=20)
              with ThreadPoolExecutor(max_workers=workers) as pool:
                  results = list(pool.map(run, range(200)))
              counts = Counter(result.returncode for result in results)
              print(name, dict(counts), flush=True)
              for result in results:
                  if result.returncode not in (0, 77):
                      print('Failure:', result.returncode, result.stdout, result.stderr, flush=True)
                      break
              Path(f'video-heap-{name}.log').write_text(str(dict(counts)))
          PYTHON
      - name: Save heap traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-video-heap-traces
          retention-days: 3
          path: video-heap-*.log
