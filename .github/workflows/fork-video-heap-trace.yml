name: Fork Windows video heap trace

on:
  push:
    branches: [test/windows-video-heap-trace]

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Download compiled initialization probe
        uses: actions/download-artifact@v4
        with:
          name: windows-video-initialization
          github-token: ${{ github.token }}
          run-id: 37998444725
      - uses: actions/checkout@v4
        with:
          path: source
          ref: 3f8e402d2e3b4a43cea2a68a17f57ab19266b18b
          persist-credentials: false
      - name: Install matching debugger and runtime
        env:
          WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
          WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - name: Compile isolated exception handoff
        run: |
          export PATH="/c/winlibs/mingw64/bin:$PATH"
          cat > exception-handoff.cpp <<'CPP'
          #include <future>
          #include <thread>
          #include <stdexcept>
          #include <utility>
          extern "C" void NotImplemented_nid_no_patch(const char*);
          #ifdef ANYPS5_TEST_OWN_RESULT_BASE
          namespace std {
          __future_base::_Result_base::_Result_base() = default;
          __future_base::_Result_base::~_Result_base() = default;
          }
          #endif
          int main() {
              for (int attempt = 0; attempt < 100; ++attempt) {
                  std::promise<void> started;
                  auto attached = started.get_future();
                  std::jthread producer([started = std::move(started)]() mutable {
                      try { NotImplemented_nid_no_patch("isolated handoff"); }
                      catch (...) {
                          started.set_exception(std::current_exception());
                      }
                  });
                  try { attached.get(); return 1; }
                  catch (const std::runtime_error&) {}
                  producer.join();
              }
          }
          CPP
          gendef build/core/libs/libs/unpatched/libc.prx
          python - <<'PYTHON'
          from pathlib import Path
          path = Path('libc.def')
          text = path.read_text()
          print('Generated definition header:', '\n'.join(text.splitlines()[:12]))
          selected = []
          for line in text.splitlines():
              fields = line.split()
              if not fields:
                  continue
              name = fields[0].strip('"')
              if name.startswith(('__cxa_', '_Unwind_', '__gxx_personality_v0', '_ZNSt15__exception_ptr', '_ZNKSt15__exception_ptr', '_ZSt17current_exceptionv', '_ZSt17rethrow_exception')) or name == 'NotImplemented_nid_no_patch':
                  if 'DATA' not in fields:
                      selected.append(name)
          required = ['NotImplemented_nid_no_patch', '__gxx_personality_v0', '_ZSt17current_exceptionv']
          if any(name not in selected for name in required):
              raise RuntimeError('Required native exception bridge export missing')
          path.write_text('LIBRARY "libc.prx"\nEXPORTS\n' + '\n'.join(selected) + '\n')
          print('Selected function imports:', len(selected))
          PYTHON
          dlltool -d libc.def -D libc.prx -l libc-import.a
          g++ -std=c++20 -O3 -g -fno-asynchronous-unwind-tables exception-handoff.cpp libc-import.a -o build/tests/exception-handoff.exe
          objcopy --rename-section .eh_frame=.ehfram build/tests/exception-handoff.exe
          g++ -std=c++20 -O3 -g -fno-asynchronous-unwind-tables -DANYPS5_TEST_OWN_RESULT_BASE exception-handoff.cpp libc-import.a -o build/tests/exception-handoff-result.exe
          objcopy --rename-section .eh_frame=.ehfram build/tests/exception-handoff-result.exe
          python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          for path in [Path('build/tests/exception-handoff.exe'), Path('build/core/libs/libs/unpatched/libSceVideoOut.prx')]:
              dump = subprocess.check_output(['objdump', '-p', str(path)], text=True)
              print('Imports:', path)
              library = ''
              for line in dump.splitlines():
                  if 'DLL Name:' in line:
                      library = line.strip()
                  if any(name in line for name in ['current_exception', 'rethrow_exception', 'M_addref', 'M_release', '__cxa_']):
                      print(library, line.strip())
          PYTHON
      - name: Enable isolated executable page heap
        shell: pwsh
        run: |
          $probeKey = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\exception-handoff.exe'
          New-Item -Path $probeKey -Force | Out-Null
          New-ItemProperty -Path $probeKey -Name GlobalFlag -PropertyType String -Value '0x02000000' -Force | Out-Null
          New-ItemProperty -Path $probeKey -Name PageHeapFlags -PropertyType String -Value '0x3' -Force | Out-Null
      - name: Capture isolated handoff backtrace
        run: |
          export PATH="$GITHUB_WORKSPACE/build/core/libs/libs/unpatched:$GITHUB_WORKSPACE/build/tests:/c/winlibs/mingw64/bin:$PATH"
          cd build
          gdb -batch -ex 'set pagination off' -ex 'set print thread-events off' -ex 'run' -ex 'thread apply all bt full' --args tests/exception-handoff.exe 2>&1 | tee "$GITHUB_WORKSPACE/video-heap-isolated-backtrace.log"
      - name: Remove isolated executable page heap
        if: ${{ always() }}
        shell: pwsh
        run: Remove-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\exception-handoff.exe' -Recurse -Force -ErrorAction SilentlyContinue
      - name: Repeat isolated handoff
        run: |
          export PATH="$GITHUB_WORKSPACE/build/core/libs/libs/unpatched:$GITHUB_WORKSPACE/build/tests:/c/winlibs/mingw64/bin:$PATH"
          python - <<'PYTHON'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter
          import os
          import subprocess
          root = Path.cwd()
          all_counts = {}
          for name in ['exception-handoff', 'exception-handoff-result']:
              binary = root / 'build/tests' / (name + '.exe')
              def run(attempt):
                  return subprocess.run([str(binary)], cwd=root / 'build', capture_output=True, text=True, timeout=20)
              with ThreadPoolExecutor(max_workers=2) as pool:
                  results = list(pool.map(run, range(200)))
              counts = Counter(result.returncode for result in results)
              all_counts[name] = dict(counts)
              print(name, dict(counts), flush=True)
              for result in results:
                  if result.returncode != 0:
                      print('Failure:', result.returncode, result.stdout, result.stderr, flush=True)
                      break
          Path('video-heap-isolated-handoff.log').write_text(str(all_counts))
          if all_counts['exception-handoff-result'] != {0: 200}:
              raise RuntimeError('Owned future result did not preserve exception lifetime')
          if all_counts['exception-handoff'] == {0: 200}:
              raise RuntimeError('Negative control did not reproduce')
          PYTHON
      - name: Preserve native future helpers through NID patching
        run: |
          export PATH="$GITHUB_WORKSPACE/build/core/libs/libs/unpatched:$GITHUB_WORKSPACE/build/tests:/c/winlibs/mingw64/bin:$PATH"
          python - <<'PYTHON'
          from pathlib import Path
          symbols = ['_ZNSt13__future_base12_Result_base' + suffix for suffix in ['C1Ev', 'C2Ev', 'D0Ev', 'D1Ev', 'D2Ev']]
          symbols += ['_ZT' + kind + 'NSt13__future_base12_Result_baseE' for kind in ['I', 'S', 'V']]
          content = '#include <future>\nnamespace std {\n__future_base::_Result_base::_Result_base() = default;\n__future_base::_Result_base::~_Result_base() = default;\n}\n'
          for symbol in symbols:
              alias = symbol + '_nid_no_patch_cut'
              content += 'asm(".globl ' + alias + '\\n.set ' + alias + ',' + symbol + '\\n");\n'
          Path('future-result.cpp').write_text(content)
          PYTHON
          g++ -std=c++20 -O3 -fno-asynchronous-unwind-tables -shared future-result.cpp libc-import.a -Wl,--out-implib,future-result.a -o build/tests/future-result.dll
          objcopy --rename-section .eh_frame=.ehfram build/tests/future-result.dll
          g++ -std=c++20 -O3 -fno-asynchronous-unwind-tables exception-handoff.cpp future-result.a libc-import.a -o build/tests/exception-handoff-native.exe
          objcopy --rename-section .eh_frame=.ehfram build/tests/exception-handoff-native.exe
          g++ -std=c++20 -O2 -static -static-libgcc -static-libstdc++ -Isource/core/libs/nid/include source/core/libs/nid/src/*.cpp -o nid-patcher.exe
          ./nid-patcher.exe libc build/tests/future-result.dll
          python - <<'PYTHON'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter
          import subprocess
          root = Path.cwd()
          dump = subprocess.check_output(['objdump', '-p', 'build/tests/future-result.dll'], text=True)
          print('Patched future exports:', '\n'.join(line for line in dump.splitlines() if 'Result_base' in line))
          symbols = ['_ZNSt13__future_base12_Result_base' + suffix for suffix in ['C1Ev', 'C2Ev', 'D0Ev', 'D1Ev', 'D2Ev']]
          symbols += ['_ZT' + kind + 'NSt13__future_base12_Result_baseE' for kind in ['I', 'S', 'V']]
          exported = {line.split()[-1] for line in dump.splitlines() if 'Result_base' in line}
          if any(symbol not in exported for symbol in symbols):
              raise RuntimeError('Native future export was lost after NID patching')
          def run(attempt):
              return subprocess.run([str(root / 'build/tests/exception-handoff-native.exe')], cwd=root / 'build', capture_output=True, text=True, timeout=20)
          with ThreadPoolExecutor(max_workers=2) as pool:
              results = list(pool.map(run, range(200)))
          counts = Counter(result.returncode for result in results)
          print('patched_native_future', dict(counts), flush=True)
          Path('video-heap-patched-native-future.log').write_text(str(dict(counts)))
          if counts != {0: 200}:
              failure = next(result for result in results if result.returncode != 0)
              print(failure.returncode, failure.stdout, failure.stderr)
              raise RuntimeError('Patched native future handoff failed')
          PYTHON
      - name: Save heap traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-video-heap-traces
          retention-days: 3
          path: video-heap-*.log
