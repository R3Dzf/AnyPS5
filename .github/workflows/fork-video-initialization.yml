name: Fork Windows video initialization diagnostics

on:
  push:
    branches: [test/windows-video-initialization]

permissions:
  contents: read

concurrency:
  group: fork-video-init-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install supported WinLibs toolchain
        env:
          WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
          WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
          echo 'SSL_CERT_FILE=C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt' >> "$GITHUB_ENV"
      - name: Configure debug symbols
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Prepare missing-cleanup negative control
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          path = Path('core/libs/tests/GuestVideoOutWqhdDetection.cpp')
          text = path.read_text()
          expected = '        LibcRunShutdown_nid_postfix();\n'
          if text.count(expected) != 1:
              raise RuntimeError('Expected exactly one failure-path shutdown call')
          path.write_text(text.replace(expected, ''))
          PYTHON
      - name: Build missing-cleanup negative control
        run: cmake --build build --target guest_video_out_wqhd_detection_tests --parallel 3
      - name: Exercise initialization repeatedly
        continue-on-error: true
        run: |
          for attempt in {1..15}; do
            ctest --test-dir build --output-on-failure --timeout 20 --parallel 2 -R '^guest_video_out_wqhd_detection(_no_vulkan)?$' --output-log "$GITHUB_WORKSPACE/video-init-negative-$attempt.log"
          done
      - name: Capture initialization debugger trace
        run: |
          export PATH="$GITHUB_WORKSPACE/build/core/libs/libs/unpatched:$GITHUB_WORKSPACE/build/tests:/c/winlibs/mingw64/bin:$PATH"
          gdb --version
          cd build
          gdb -batch -ex 'set pagination off' -ex 'set print thread-events off' -ex 'run' -ex 'thread apply all bt' --args tests/guest_video_out_wqhd_detection_tests.exe 2>&1 | tee "$GITHUB_WORKSPACE/video-init-gdb.log"
      - name: Restore failure-path cleanup and rebuild test
        run: |
          git checkout -- core/libs/tests/GuestVideoOutWqhdDetection.cpp
          cmake --build build --target guest_video_out_wqhd_detection_tests --parallel 3
      - name: Verify clean shutdown repeatedly
        run: |
          for attempt in {1..15}; do
            ctest --test-dir build --output-on-failure --timeout 20 --parallel 2 -R '^guest_video_out_wqhd_detection(_no_vulkan)?$' --output-log "$GITHUB_WORKSPACE/video-init-fixed-$attempt.log"
          done
      - name: Save initialization diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-video-initialization
          path: |
            video-init-*.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
