name: Fork Windows video initialization diagnostics

on:
  push:
    branches: [test/windows-video-initialization]

permissions:
  contents: read

concurrency:
  group: fork-video-init-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install supported WinLibs toolchain
        env:
          WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
          WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
          echo 'SSL_CERT_FILE=C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt' >> "$GITHUB_ENV"
      - name: Configure debug symbols
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build window initialization test
        run: cmake --build build --target guest_video_out_wqhd_detection_tests --parallel 3
      - name: Exercise initialization repeatedly
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure --timeout 20 --parallel 2 --repeat until-fail:15 -R '^guest_video_out_wqhd_detection(_no_vulkan)?$' --output-log "$GITHUB_WORKSPACE/video-init-ctest.log"
      - name: Capture initialization debugger trace
        run: |
          export PATH="$GITHUB_WORKSPACE/build/core/libs/libs/unpatched:$GITHUB_WORKSPACE/build/tests:/c/winlibs/mingw64/bin:$PATH"
          gdb --version
          cd build
          gdb -batch -ex 'set pagination off' -ex 'set print thread-events off' -ex 'run' -ex 'thread apply all bt' --args tests/guest_video_out_wqhd_detection_tests.exe 2>&1 | tee "$GITHUB_WORKSPACE/video-init-gdb.log"
      - name: Save initialization diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-video-initialization
          path: |
            video-init-ctest.log
            video-init-gdb.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
