name: Fork device-buffer recovery validation

on:
  push:
    branches: [fix/agc-device-buffer-failure]

permissions:
  contents: read

concurrency:
  group: fork-device-buffer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Buffer tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev libxext-dev libvulkan1 mesa-vulkan-drivers
      - name: Install supported WinLibs toolchain
        if: runner.os == 'Windows'
        env:
          WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
          WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
          echo 'SSL_CERT_FILE=C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt' >> "$GITHUB_ENV"
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Verify test registration
        run: python tools/check_test_registration.py build
      - name: Build affected tests
        run: cmake --build build --target agc_device_buffer_failure_tests agc_buffer_pool_tests agc_driver_graphics_tests --parallel 3
      - name: Test buffer recovery and graphics resources
        run: ctest --test-dir build --output-on-failure --timeout 30 -R '^(agc_device_buffer_failure|agc_buffer_pool|agc_driver_graphics)$' --output-log "$GITHUB_WORKSPACE/buffer-tests.log"
      - name: Save test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: device-buffer-tests-${{ runner.os }}
          path: |
            buffer-tests.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
