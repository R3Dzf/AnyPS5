name: Fork contribution validation

on:
  push:
    branches:
      - ci/fork-validation

permissions:
  contents: read

jobs:
  guest-tests:
    name: ${{ matrix.test }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: integration/multilib-usbd-csprng
            target: guest_font_tests guest_ssl_tests guest_voice_qos_tests guest_random_tests guest_usbd_tests guest_usbd_control_tests
            test: '(guest_font|guest_ssl|guest_voice_qos|guest_random|guest_usbd(_control)?)'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
          submodules: recursive
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libvulkan1 mesa-vulkan-drivers libx11-dev libxext-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build guest regression test
        run: cmake --build build --target ${{ matrix.target }} --parallel 3
      - name: Run guest regression test
        run: ctest --test-dir build --output-on-failure --timeout 30 -R "^${{ matrix.test }}$"

  windows-guest-tests:
    name: ${{ matrix.test }} / Windows
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: integration/multilib-usbd-csprng
            target: guest_font_tests guest_ssl_tests guest_voice_qos_tests guest_random_tests guest_usbd_tests guest_usbd_control_tests
            test: '(guest_font|guest_ssl|guest_voice_qos|guest_random|guest_usbd(_control)?)'
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\\Program Files\\Git\\mingw64\\etc\\ssl\\certs\\ca-bundle.crt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
          submodules: recursive
      - name: Install project-supported WinLibs toolchain
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
          echo 'C:\\winlibs\\mingw64\\bin' >> "$GITHUB_PATH"
      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build guest regression test
        run: cmake --build build --target ${{ matrix.target }} --parallel 3
      - name: Run guest regression test
        run: ctest --test-dir build --output-on-failure --timeout 30 -R "^${{ matrix.test }}$"

  library-progress:
    name: Measure integration library coverage
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/multilib-usbd-csprng
          persist-credentials: false
      - name: Run upstream progress scanner
        run: python3 tools/progress.py "$RUNNER_TEMP/progress"
      - name: Preserve generated coverage
        uses: actions/upload-artifact@v4
        with:
          name: integrated-library-progress
          path: ${{ runner.temp }}/progress/progress.json
