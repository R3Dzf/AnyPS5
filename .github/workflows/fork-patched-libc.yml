name: Fork Windows PE loader compatibility

on:
  push:
    branches: [fix/nid-pe-loader-compatibility]

permissions:
  contents: read

concurrency:
  group: fork-patched-libc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install supported WinLibs toolchain
        env:
          WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
          WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
          echo 'SSL_CERT_FILE=C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt' >> "$GITHUB_ENV"
      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build libc and patcher
        run: cmake --build build --target libc nid_patcher --parallel 3
      - name: Prepare patched libc loader
        run: |
          cp build/core/libs/libs/unpatched/libc.prx build/core/libs/libs/libc.prx
          build/core/libs/nid_patcher.exe libc build/core/libs/libs/libc.prx
          g++ -std=c++20 -O2 -fasynchronous-unwind-tables -static -static-libgcc -static-libstdc++ core/libs/tests/PatchedLibraries.cpp -o build/tests/patched_libraries_tests.exe
      - name: Verify CMake runtime selection and load patched libc
        run: |
          python - <<'PYTHON'
          import json, subprocess
          tests = json.loads(subprocess.check_output(['ctest', '--test-dir', 'build', '--show-only=json-v1']))['tests']
          test = next(test for test in tests if test['name'] == 'patched_libraries')
          property = next(prop['value'] for prop in test['properties'] if prop['name'] == 'ENVIRONMENT_MODIFICATION')
          if len(property) != 1 or not property[0].startswith('PATH=path_list_prepend:') or not property[0].replace('\\', '/').endswith('/build/tests'):
              raise RuntimeError(f'Unexpected patched-library runtime configuration: {property}')
          print('Generated CTest runtime selection:', property)
          PYTHON
          ctest --test-dir build --output-on-failure --timeout 30 -R '^patched_libraries$' --output-log "$GITHUB_WORKSPACE/patched-libc-ctest.log"
      - name: Save loader test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-patched-libc-test
          path: |
            patched-libc-ctest.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
