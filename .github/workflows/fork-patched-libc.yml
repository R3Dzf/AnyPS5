name: Fork Windows PE loader compatibility

on:
  push:
    branches: [fix/nid-pe-loader-compatibility]

permissions:
  contents: read

concurrency:
  group: fork-patched-libc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install supported WinLibs toolchain
        env:
          WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
          WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
          echo 'SSL_CERT_FILE=C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt' >> "$GITHUB_ENV"
      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build libc and patcher
        run: cmake --build build --target libc nid_patcher --parallel 3
      - name: Patch libc and inspect imports
        run: |
          mkdir -p build/probe
          cp build/core/libs/libs/unpatched/libc.prx build/probe/libc.prx
          build/core/libs/nid_patcher.exe libc build/probe/libc.prx
          objdump -p build/core/libs/libs/unpatched/libc.prx | sed -n '/The Import Tables/,/The Export Tables/p'
          objdump -p build/probe/libc.prx | sed -n '/The Import Tables/,/The Export Tables/p'
      - name: Resolve native imports before loading libc
        run: |
          python - <<'PYTHON'
          import ctypes, os, struct
          from pathlib import Path
          runtime = os.add_dll_directory('C:/winlibs/mingw64/bin')
          kernel = ctypes.WinDLL('kernel32', use_last_error=True)
          kernel.SetErrorMode(0x8001)
          kernel.GetProcAddress.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          kernel.GetProcAddress.restype = ctypes.c_void_p
          for path in (Path('build/core/libs/libs/unpatched/libc.prx'), Path('build/probe/libc.prx')):
              data = path.read_bytes()
              header = struct.unpack_from('<I', data, 0x3c)[0]
              optional = header + 24
              count = struct.unpack_from('<H', data, header + 6)[0]
              size = struct.unpack_from('<H', data, header + 20)[0]
              sections = [struct.unpack_from('<8sIIIIIIHHI', data, optional + size + i * 40) for i in range(count)]
              def offset(rva):
                  return next(s[4] + rva - s[2] for s in sections if s[2] <= rva < s[2] + s[3])
              def name(rva):
                  start = offset(rva)
                  return data[start:data.index(b'\0', start)].decode()
              descriptor = offset(struct.unpack_from('<I', data, optional + 120)[0])
              missing = 0
              while True:
                  original, _, _, library, first = struct.unpack_from('<IIIII', data, descriptor)
                  if not (original or first): break
                  library = name(library)
                  loaded = ctypes.WinDLL(library)
                  thunk = offset(original or first)
                  while True:
                      entry = struct.unpack_from('<Q', data, thunk)[0]
                      if not entry: break
                      if not entry >> 63:
                          symbol = name(entry + 2)
                          if not kernel.GetProcAddress(loaded._handle, symbol.encode()):
                              print(path, library, 'missing import', symbol, flush=True)
                              missing += 1
                      thunk += 8
                  descriptor += 20
              print(path, 'unresolved native imports:', missing, flush=True)
              try:
                  loaded = ctypes.WinDLL(str(path.resolve()), winmode=8)
                  print(path, 'loaded successfully', flush=True)
              except OSError as error:
                  print(path, 'loader error:', error, flush=True)
          PYTHON
      - name: Load patched libc
        run: |
          g++ -std=c++20 -O2 -static -static-libgcc -static-libstdc++ core/libs/tests/PatchedLibraries.cpp -o build/patched-libc-probe.exe
          where.exe libstdc++-6.dll
          if build/patched-libc-probe.exe "$(cygpath -w "$GITHUB_WORKSPACE/build/probe")"; then
            echo 'Default runtime search succeeded'
          else
            echo 'Default runtime search failed'
          fi
          export PATH="$GITHUB_WORKSPACE/build/tests:$PATH"
          build/patched-libc-probe.exe "$(cygpath -w "$GITHUB_WORKSPACE/build/probe")"
      - name: Save libc probe binaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-patched-libc-probe
          path: |
            build/probe/libc.prx
            build/core/libs/libs/unpatched/libc.prx
          if-no-files-found: ignore
